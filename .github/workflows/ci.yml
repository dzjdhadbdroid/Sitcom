name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
# Le déploiement est assuré par l'intégration Git de Cloudflare (voir docs/DEPLOYMENT.md) :
# chaque fusion sur « main » est construite et publiée automatiquement. Aucun secret n'est stocké dans GitHub.
